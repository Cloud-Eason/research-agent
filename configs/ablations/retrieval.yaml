# Layer 1: retrieval only, no LLM. One run of the full pipeline reports every
# stage (dense / bm25 / fused / reranked), so each run below yields 4 rows.
name: retrieval_v1
layer: retrieval
dataset:
  sample_path: data/eval/hotpotqa_validation_500_s42.jsonl
  n: 500
top_k: 20
base:
  kb_collection_prefix: hotpot
  retrieval_use_dense: true
  retrieval_use_bm25: true
  retrieval_use_rerank: true
  retrieval_dense_top_k: 50
  retrieval_bm25_top_k: 50
  retrieval_rerank_candidates: 20   # same as the agent; compare stages at k <= 20
  retrieval_final_top_n: 20
  retrieval_min_rerank_score: null
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
runs:
  - name: c64_minilm
    settings: {chunk_size: 64, chunk_overlap: 8}
  - name: c128_minilm
    settings: {chunk_size: 128, chunk_overlap: 16}
  - name: c256_minilm
    settings: {chunk_size: 256, chunk_overlap: 32}
  - name: c128_minilm_first100
    limit: 100   # same 100 questions as c128_bge, for an apples-to-apples comparison
    settings: {chunk_size: 128, chunk_overlap: 16}
  - name: c128_bge
    limit: 100   # ~10x slower reranker on CPU; same first 100 questions as the others
    settings: {chunk_size: 128, chunk_overlap: 16, reranker_model: BAAI/bge-reranker-base}
