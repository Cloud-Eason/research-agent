# Layer 2: end-to-end agent. Web search is OFF in every run: HotpotQA answers are
# on Wikipedia, so a web tool would measure the search engine, not this RAG.
# chunk_size below should be set to the best value from retrieval_v1.
name: agent_v1
layer: agent
dataset:
  sample_path: data/eval/hotpotqa_validation_500_s42.jsonl
  n: 300          # the first 300 of the same 500-question sample
concurrency: 4
timeout_s: 240
base:
  kb_collection_prefix: hotpot
  enable_web_search: false
  enable_kb_search: true
  chunk_size: 128
  chunk_overlap: 16
  max_agent_steps: 8
  retrieval_dense_top_k: 20
  retrieval_bm25_top_k: 20
  retrieval_rerank_candidates: 20
  retrieval_final_top_n: 5
  retrieval_min_rerank_score: null
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
runs:
  - name: no_retrieval
    settings: {enable_kb_search: false}
  - name: dense
    settings: {retrieval_use_bm25: false, retrieval_use_rerank: false}
  - name: hybrid
    settings: {retrieval_use_rerank: false}
  - name: hybrid_minilm
    settings: {}
  - name: hybrid_bge
    limit: 100
    settings: {reranker_model: BAAI/bge-reranker-base}
